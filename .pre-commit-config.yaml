repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (Conventional Commits)
        language: system
        entry: npx --no -- commitlint --edit
        stages: [commit-msg]
